site_name: GCES - MEPA
site_description: Documentação do projeto da disciplina GCES focado em contribuições ao software livre MEPA.
site_author: Grupo GCES
theme:
  name: material
  language: PT-BR
  logo: assets/favicoMEPA.png
  favicon: assets/favicoMEPA.png


nav:
  - Início: index.md
  - Sprints:
      - Sprint 0: sprints/sprint-1.md
      - Sprint 1: sprints/sprint-2.md
      - Sprint 2: sprints/sprint-3.md
      - Sprint 3: sprints/sprint-4.md
  - Contribuições:
      - Integrante 1: sprints/sprint-4.md
  - Relatórios: sprints/sprint-4.md
  - Reuniões:
      - Sprint 3: sprints/sprint-4.md

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css